# Overwrite all OMOP vocabulary tables, including tables with only
# Athena vocabulary and tables with both Athena and custom vocabulary
resources:
  jobs:
    omop_vocabulary_refresh:
      name: omop_vocabulary_refresh
      tasks:
        # Update tables with only Athena vocabulary
        - task_key: vocabulary_athena_only
          sql_task:
            file:
              path: ../../models/vocabulary_concept/vocabulary_concepts_athena_only.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_schema: ${var.omop_schema}
              omop_vocab_schema: ${var.omop_vocab_schema}
            warehouse_id: ${var.warehouse_id}
        # Update tables with both Athena and custom vocabulary
        - task_key: vocabulary_custom
          sql_task:
            file: 
              path: ../../models/vocabulary_concept/vocabulary_concepts_custom_updates.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_schema: ${var.omop_schema}
              omop_vocab_schema: ${var.omop_vocab_schema}
            warehouse_id: ${var.warehouse_id}
      queue:
        enabled: true
      performance_target: STANDARD
      tags:
        Function: Transformation
        "Transformation Jobs": OMOP
