resources:
  jobs:
    omop_schema_creation:
      name: omop_schema_creation
      tasks:
        - task_key: table_creation
          sql_task:
            file: 
                path: ../../models/table_creation/table_creation.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_schema: ${var.omop_schema}
            warehouse_id: ${var.warehouse_id}
        - task_key: intermediate_table_creation
          sql_task:
            file: 
              path: ../../models/table_creation/intermediate_table_creation.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_intermediate_schema: ${var.omop_intermediate_schema}
              clarity_catalog: ${var.clarity_catalog}
              clarity_daily_schema: ${var.clarity_daily_schema}
            warehouse_id: ${var.warehouse_id}
        - task_key: not_null_constraints
          depends_on:
            - task_key: table_creation
          sql_task:
            file: 
              path: ../../models/table_creation/not_null_constraints.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_schema: ${var.omop_schema}
            warehouse_id: ${var.warehouse_id}
        - task_key: primary_key_constraints
          depends_on:
            - task_key: not_null_constraints
          sql_task:
            file: 
              path: ../../models/table_creation/primary_key_constraints.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_schema: ${var.omop_schema}
            warehouse_id: ${var.warehouse_id}
        - task_key: foreign_key_constraints
          depends_on:
            - task_key: primary_key_constraints
          sql_task:
            file: 
              path: ../../models/table_creation/foreign_key_constraints.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_schema: ${var.omop_schema}
            warehouse_id: ${var.warehouse_id}
        - task_key: person_preprocessing_comments
          depends_on:
            - task_key: intermediate_table_creation
