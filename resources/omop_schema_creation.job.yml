            file: 
              path: ../../models/person_preprocessing/person_preprocessing_comments.sql
            parameters:
              omop_catalog: ${var.omop_catalog}
              omop_intermediate_schema: ${var.omop_intermediate_schema}
            warehouse_id: ${var.warehouse_id}
        - task_key: visit_occurrence_comments
